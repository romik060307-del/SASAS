plugins {
    id 'com.android.application'
}

android {
    namespace 'id.rk.aserver'
    compileSdk 35

    defaultConfig {
        applicationId 'id.rk.aserver'
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName '1.5.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
